name: video_action_recognition_env
channels:
  - defaults
  - conda-forge
dependencies:
  # Core Python environment (via conda):
  - python=3.10
  - pip
  - numpy
  - pandas
  - scipy
  - pyyaml
  - matplotlib
  - jupyter
  - pytest
  - tqdm
  - scikit-learn
  - av

 # ── Pip‑installed packages ────────────────────────────────
  - pip:
    # Pull wheels from the CUDA‑11.8 channel **first**
    - "--extra-index-url https://download.pytorch.org/whl/cu118"

    - torch
    - torchvision
    - torchaudio
    - skorch
    - mlflow

